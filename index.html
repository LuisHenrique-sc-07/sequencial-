<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Calculadora</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <section class="container">
        <h1>Calculador e Soma</h1>
        <input type="number" id="numero1" placeholder="Digite o primeiro número">
        <input type="number" id="numero2" placeholder="Digite o segundo número">

        <button onclick="somar()"> Calcular Soma</button>

        <h2 id="resultado">Resultado: </h2>
    </section>

    <section class="container">
        <h1>Converter Celsius para Fahrenheit</h1>

        <input type="text" id="celsius" placeholder="Digite a temperatura">

        <button onclick="converter()">Converter</button>

        <h2 id="resultado2">Resultado:</h2>
    </section>

    <section class="container">
        <h1>Calculando volume da lata</h1>

        <input type="text" id="altura" placeholder="Digite a altura da lata">
        <input type="text" id="raio" placeholder="Digite o raio da lata">

        <button onclick="volume()">Calcular volume</button>

        <h2 id="resultado3">Resultado:</h2>
    </section>

    <section class="container">
        <h1>Calculando o volume da caixa</h1>

        <input type="number" id="comprimento"
        placeholder="Digite o Comprimento">

        <input type="number" id="largura"
        placeholder="Digite a largura">

        <input type="number" id="altura1"
        placeholder="Digite a altura">

        <button onclick="volumecaixa()">Calcular Volume</button>

        <h2 id="resultado4">Resultado:</h2>


    </section>

    <script src="JS/script.js"></script>
</body>

</html>
